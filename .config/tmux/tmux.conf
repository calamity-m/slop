# tmux configuration, styled after dlvhdr/dotfiles.
# Colors come from the kanagawa-custom theme in ../zellij/config.kdl so both
# multiplexers look the same:
#   bg #16161d  fg #dcd7ba  blue #7e9cd8  orange #ffa066  green #76946a
#   purple #957fb8  red #c34043  dim gray #54546d  mid gray #727169
#
# Keys (prefix is C-Space):
#   prefix 1-9        jump to window N
#   prefix C-h / C-l  previous / next window (repeatable)
#   prefix Tab        toggle last window
#   prefix h/j/k/l    move between panes
#   prefix H/J/K/L    resize pane (repeatable)
#   prefix S-arrows   resize pane (repeatable)
#   prefix r / d      split right / below
#   prefix f          toggle persistent scratch terminal
#   prefix R          reload this file
#   prefix D          detach from session
#   prefix I / U      install / update plugins
#   prefix M-u        remove plugins no longer listed below
#   prefix /          show this cheatsheet

# --- general ---------------------------------------------------------------
set -g default-terminal "tmux-256color"
# Advertise truecolor for any outer terminal; nvim themes need this.
set -ga terminal-overrides ",*:Tc"
set -g mouse on
set -s escape-time 0
set -g focus-events on
set -g history-limit 50000
set -g set-clipboard on
setw -g mode-keys vi

# Number windows/panes from 1 and keep them gapless, so prefix+N matches the
# order shown in the status bar.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Window names follow the running command (nvim, node, lazygit, ...); this is
# the plugin-free stand-in for tmux-nerd-font-window-name.
setw -g automatic-rename on

# --- sessions --------------------------------------------------------------
# tmux has no "default session name" option, so name unnamed sessions after the
# directory they start in (~/code/slop -> "slop") instead of 0, 1, 2. The guard
# fires only when the name is all digits, i.e. tmux auto-assigned it, so
# `tmux new -s foo` and any later manual rename are left alone. Dots become
# dashes because tmux reads a "." in a target name as pane syntax, which breaks
# `new-window -t <session>`. A duplicate name makes rename-session fail
# silently and the session keeps its number.
set-hook -g session-created 'if -F "#{m:*[!0-9]*,#{session_name}}" "" "rename-session -- \"#{s/[.]/-/:#{b:session_path}}\""'

# --- prefix ----------------------------------------------------------------
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# --- windows ---------------------------------------------------------------
bind c new-window -c "#{pane_current_path}"
bind -r C-h previous-window
bind -r C-l next-window
bind Tab last-window

# --- panes -----------------------------------------------------------------
# Split keys match zellij (r = right, d = down). This shadows tmux's default
# prefix+d (detach); detach with `prefix D` instead.
bind r split-window -h -c "#{pane_current_path}"
bind d split-window -v -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind -r S-Left resize-pane -L 5
bind -r S-Down resize-pane -D 5
bind -r S-Up resize-pane -U 5
bind -r S-Right resize-pane -R 5

# --- scratch terminal -------------------------------------------------------
# Clear retired bindings even when this file is reloaded into an existing
# server.
unbind f
unbind g
unbind e
unbind M-i
# The local implementation also has unbound pane-conversion commands; see
# scripts/floating-terminal --help.
bind f run-shell -b "~/.config/tmux/scripts/floating-terminal toggle '#{pane_id}'"

# --- copy mode -------------------------------------------------------------
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# --- misc ------------------------------------------------------------------
bind R source-file ~/.config/tmux/tmux.conf \; display "config reloaded"
bind D detach-client

# Float the cheat-sheet comment block from the top of this file; keep that
# block in sync when binds change.
bind / display-popup -w 50 -h 17 -T " prefix C-Space " -E "grep -E '^#   prefix ' ~/.config/tmux/tmux.conf | sed 's/^#  //' | less -~"

# --- plugins ---------------------------------------------------------------
# TPM and everything it clones live outside this repo, under
# ~/.local/share/tmux/plugins, so plugin checkouts never land in the working
# tree. install.sh clones TPM there; plugins are intentionally unpinned and
# track upstream via `prefix U`.
#
# tmux expands "$HOME" inside double-quoted config strings, but TPM stores this
# value verbatim, so the quotes matter here.
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.local/share/tmux/plugins/"

# Add plugins here:  set -g @plugin 'owner/repo'
set -g @plugin 'alexwforsythe/tmux-which-key'


# TPM reads every @plugin set above it, so this must stay the last line in the
# file. The guard keeps tmux quiet on a machine where install.sh hasn't run yet.
if-shell '[ -x "$HOME/.local/share/tmux/plugins/tpm/tpm" ]' \
  'run "$HOME/.local/share/tmux/plugins/tpm/tpm"'

# --- random shit

# seem to need this for pi to get enter key
set -g extended-keys on

# --- status bar ------------------------------------------------------------
set -g status on
set -g status-position top
set -g status-interval 5
# absolute-centre pins the window list to the middle of the terminal regardless
# of how wide the left/right segments get (tmux 3.2+).
set -g status-justify absolute-centre
# bg=default keeps the terminal's own background showing through.
set -g status-style "bg=default,fg=#dcd7ba"

# Session name, dim until the prefix is held; then it becomes a filled orange
# pill as a mode indicator. The  /  half-circles replace the surrounding
# padding spaces rather than adding to them, so the segment width never shifts.
# Styles inside #{?...} must stay single-attribute: a comma in #[bg=x,fg=y]
# would be read as the conditional's branch separator.
set -g status-left-length 100
set -g status-left "#[bg=default,fg=#727169,nobold]#{?client_prefix,#[fg=#ffa066], #S }#[bg=#ffa066,fg=#16161d,bold]#{?client_prefix,#S,}#[bg=default,fg=#ffa066,nobold]#{?client_prefix,,}"

# Dim/bright contrast alone marks the current window; the dot is the only
# separator.
set -g window-status-separator "•"
set -g window-status-format "#[fg=#54546d] #I #W "
# Trailing 󰊓 marks the current window's active pane as zoomed.
set -g window-status-current-format "#[fg=#dcd7ba] #I #W #[fg=#7e9cd8]#{?window_zoomed_flag,󰊓,}"

# Poor man's gitmux: current branch of the focused pane's directory, plus a clock.
set -g status-right-length 80
set -g status-right "#[fg=#957fb8]#(cd '#{pane_current_path}' 2>/dev/null && git rev-parse --abbrev-ref HEAD 2>/dev/null) #[fg=#727169]│ #[fg=#dcd7ba]%H:%M "

# --- panes / messages styling ----------------------------------------------
set -g pane-border-style "fg=#54546d"
set -g pane-active-border-style "fg=#7e9cd8"
# Show the running command as a pane title when a window has multiple panes.
set -g pane-border-status top
set -g pane-border-format " #{pane_current_command} "

set -g message-style "bg=#16161d,fg=#dcd7ba"
set -g mode-style "bg=#7e9cd8,fg=#16161d"
